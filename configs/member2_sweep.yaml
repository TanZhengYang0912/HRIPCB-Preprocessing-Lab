module: member2
dataset: HRIPCB_UPDATE
split: val
checkpoint: runs/baseline/weights/best.pt
data_config: configs/hripcb_local.yaml
imgsz: 1024
conf: 0.25
iou: 0.7
device: auto
workers: 0
jpeg_quality: 95
image_metrics_max_side: 256
primary_metric: map50_95
model_id: baseline
model_label: Baseline YOLO
training_preprocessing: original
evaluation_type: ablation
wavelet_presets:
  - id: w_db1
    wavelet: db1
    method: BayesShrink
    mode: soft
  - id: w_sym4
    wavelet: sym4
    method: BayesShrink
    mode: soft
  - id: w_visu
    wavelet: sym4
    method: VisuShrink
    mode: soft
    wavelet_levels: 2
homomorphic_presets:
  - id: h_c30
    gamma_low: 0.5
    gamma_high: 1.5
    cutoff: 30.0
  - id: h_c50
    gamma_low: 0.7
    gamma_high: 1.3
    cutoff: 50.0
  - id: h_c80
    gamma_low: 0.8
    gamma_high: 1.2
    cutoff: 80.0
